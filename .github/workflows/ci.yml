name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # One job calling one entry point. Section 12.6 of engine.md asks for a single
  # verification so that "green" cannot mean one thing here and another on a
  # developer's machine: what CI runs is `make verify`, and nothing else.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # The linter floats rather than being pinned, on a finding worth keeping:
      # a CI linter one release ahead of the local one caught a dead store that
      # the pinned one did not. It is fetched through the module proxy, so the
      # checksum database vouches for what is installed. GOTOOLCHAIN is auto
      # here and for the runner because both are build tools from modules that
      # ask for a newer Go than this one pins; what ships is still built with
      # the toolchain go.mod names.
      - name: Install the linter
        env:
          GOTOOLCHAIN: auto
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest

      - name: Verify
        run: make verify
