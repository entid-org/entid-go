syntax = "proto3";

// Package libbusinessid.testee.v1 defines the wire protocol between the
// conformance runner and an engine under test.
//
// The runner is the only program that reads expected results. A testee
// receives a request, calls the public API of its engine, and reports what it
// observed. It never sees an expectation, so it cannot declare itself
// conformant by comparing too weakly.
//
// Framing: each message is preceded by its length as a 32 bit unsigned integer
// in little endian byte order. The runner writes one request to the standard
// input of the testee and reads exactly one response from its standard output
// before sending the next. The exchange is strictly synchronous, which keeps a
// testee to a read-answer loop with no buffering concern, and removes any risk
// of both sides blocking on a full pipe.
//
// The testee echoes the case identifier so that a desynchronized exchange is
// detected rather than silently scoring the wrong case. It must not use the
// identifier for anything else.
package libbusinessid.testee.v1;

import "libbusinessid/conformance/v1/conformance.proto";
import "libbusinessid/ir/v1/rules.proto";

option go_package = "github.com/libbusinessid/spec/gen/go/libbusinessid/testee/v1;testeev1";

// TesteeRequest is one unit of work handed to a testee.
message TesteeRequest {
  // Identifier of the conformance case, echoed back in the response.
  string case_id = 1;
  libbusinessid.conformance.v1.Operation operation = 2;
  string input = 3;
  // Absent when the caller expresses no preference. Section 5.2 of ir.md makes
  // that absence meaningful: it is what lets a definition's default_profile
  // apply, so it must never be conflated with a profile named "". The field
  // carries explicit presence rather than relying on a convention, because a
  // protocol between independent implementations is exactly where an implied
  // convention gets read differently on each side.
  optional string profile = 4;
  optional string kind = 5;
  optional string country_code = 6;
  // Bundle to load, present only for OPERATION_LOAD_RULESET. A testee that
  // generates code ahead of time answers these through its generator.
  optional bytes rules_payload = 7;
}

// TesteeResponse reports what the engine observed for one request.
message TesteeResponse {
  string case_id = 1;
  oneof result {
    ObservedCanonicalization canonicalization = 2;
    ObservedValidationReport validation_report = 3;
    ObservedLoad load = 4;
    // The engine could not answer. This is never a conformant outcome; it is
    // reported separately so a missing capability is not confused with a wrong
    // answer.
    TesteeFailure failure = 5;
  }
}

// ObservedCanonicalization is the canonicalization the engine produced.
message ObservedCanonicalization {
  string kind = 1;
  string canonical_value = 2;
  optional string country_code = 3;
  libbusinessid.conformance.v1.StepStatus status = 4;
  libbusinessid.ir.v1.ReasonCode reason_code = 5;
}

// ObservedValidationReport is the report the engine produced.
message ObservedValidationReport {
  string kind = 1;
  string canonical_value = 2;
  optional string country_code = 3;
  ObservedStep format = 4;
  ObservedStep checksum = 5;
}

// ObservedStep is one validation level as the engine resolved it.
message ObservedStep {
  libbusinessid.conformance.v1.StepStatus status = 1;
  libbusinessid.ir.v1.ReasonCode reason_code = 2;
  // The message key the rule carries, absent when the result was produced
  // before any rule assertion. engine.md section 11.2 states that the common
  // tests compare the code and the key; without this field they compared only
  // the code, and an engine could emit any key at all without a case noticing.
  optional string message_key = 3;
}

// ObservedLoad is the outcome of submitting a bundle to the engine or to its
// generator.
message ObservedLoad {
  // True when the bundle was accepted. A hostile bundle must never be.
  bool accepted = 1;
  // Typed error when the bundle was refused: invalid_ruleset or
  // incompatible_ruleset. Empty when accepted.
  string engine_error = 2;
}

// TesteeFailure explains why no observation could be produced.
message TesteeFailure {
  FailureKind kind = 1;
  string detail = 2;
}

// FailureKind distinguishes an unsupported request from a broken one.
enum FailureKind {
  FAILURE_KIND_UNSPECIFIED = 0;
  // The engine does not implement this operation at all.
  FAILURE_KIND_UNSUPPORTED_OPERATION = 1;
  // The engine implements the operation but failed on this input.
  FAILURE_KIND_INTERNAL_ERROR = 2;
}
